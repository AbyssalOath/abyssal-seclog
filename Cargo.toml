[package]
name = "seclog"
version = "0.2.0"
edition = "2024"

[workspace]
# The eBPF programs are their own workspace members, not path dependencies of
# `seclog` compiled the normal way: `seclog-ebpf` targets `bpfel-unknown-none`
# and needs `-Z build-std`, which regular `cargo build` can't do for a
# dependency. `build.rs` (feature-gated behind `telemetry`, see below) shells
# out to build it separately, the same way the upstream aya-template does --
# see the comment on the `seclog-ebpf` path dependency below.
members = ["seclog-ebpf-common", "seclog-ebpf"]

[profile.release.package.seclog-ebpf]
debug = 2
codegen-units = 1
strip = false

# Unoptimized eBPF bytecode routinely fails the kernel verifier (too many
# instructions/branches for it to prove termination/safety on), so even a
# debug build of this one package needs -O -- doesn't affect anything else
# in the workspace.
[profile.dev.package.seclog-ebpf]
opt-level = 3

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.5.3"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hostname = "0.4.2"
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
rand = { version = "0.10.2", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json"] }
# Builds SigV4-signed requests for the archival feature's S3-compatible
# backend (AWS S3, MinIO, Backblaze B2, etc.) without pulling in the
# full aws-sdk-s3 dependency tree -- execution goes through the
# reqwest client already a dependency above.
rusty-s3 = "0.7"
# Pure-Rust async SSH/SFTP for the archival feature's SFTP backend --
# chosen over ssh2 (which wraps libssh2, a C library) specifically to
# avoid new apt packages in the Dockerfile, matching why ldap3/sqlx
# above are already pinned to rustls over OpenSSL in this codebase.
russh = "0.63"
russh-sftp = "2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "tls-rustls-ring-webpki", "derive"] }
time = "0.3"
tokio = { version = "1.53.1", features = ["full"] }
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "set-header"] }
url = "2"

# Real-time endpoint telemetry (Linux eBPF process-exec + network-connect
# sensor). Off by default: building it needs the bpfel-unknown-none target,
# a nightly toolchain (for `-Z build-std=core`), and `bpf-linker`, which in
# turn needs LLVM/clang dev libraries -- none of that should be required to
# build the server or a plain log-shipping shipper. Build with
# `cargo build --bin shipper --features telemetry` once that toolchain is
# installed; see seclog-ebpf/README.md for the exact setup steps.
aya = { version = "0.14.0", default-features = false, optional = true }
aya-log = { version = "0.3.0", default-features = false, optional = true }
libc = { version = "0.2.159", default-features = false, optional = true }
# Shared #[repr(C)] event structs with seclog-ebpf (kernel side) -- plain
# #![no_std] crate with no deps of its own, but only the shipper's telemetry
# code (ebpf_linux.rs) actually uses it, so it's gated the same as the rest.
seclog-ebpf-common = { path = "seclog-ebpf-common", optional = true }

[features]
telemetry = [
    "dep:aya", "dep:aya-log", "dep:libc", "dep:seclog-ebpf-common",
    "dep:anyhow", "dep:aya-build", "dep:cargo_metadata", "dep:seclog-ebpf",
]

[build-dependencies]
anyhow = { version = "1", optional = true }
# TODO(https://github.com/rust-lang/cargo/issues/12375): this should be an
# artifact dependency, but Cargo can't be told to build it with
# `-Z build-std`. aya-build cargo-in-cargos the actual build instead -- see
# build.rs. This entry just teaches Cargo about the dependency so build
# cache invalidation works.
aya-build = { version = "0.2.0", default-features = false, optional = true }
cargo_metadata = { version = "0.23.0", default-features = false, optional = true }
seclog-ebpf = { path = "seclog-ebpf", optional = true }
